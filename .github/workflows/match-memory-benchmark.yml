name: Match DP Memory Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save benchmark script
        run: cp packages/pinyin-pro/scripts/benchmark/match-memory.js /tmp/match-memory.js

      - name: Benchmark base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE_SHA"
          pnpm build
          PINYIN_PRO_DIST="$PWD/packages/pinyin-pro/dist/index.js"             node /tmp/match-memory.js | tee /tmp/base.txt

      - name: Benchmark head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout "$HEAD_SHA"
          pnpm build
          PINYIN_PRO_DIST="$PWD/packages/pinyin-pro/dist/index.js"             node /tmp/match-memory.js | tee /tmp/head.txt

      - name: Show comparison
        run: |
          echo "=== BASE ==="
          cat /tmp/base.txt
          echo
          echo "=== HEAD ==="
          cat /tmp/head.txt
